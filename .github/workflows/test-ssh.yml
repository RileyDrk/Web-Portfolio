name: Test SSH Connectivity

on:
  workflow_dispatch:
    inputs:
      expected_public_ip:
        description: Current public IPv4 shown by curl on the server
        required: true
        default: '142.163.95.91'
        type: string

permissions: {}

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
      EXPECTED_PUBLIC_IP: ${{ inputs.expected_public_ip }}
    steps:
      - name: Check SSH from GitHub's network
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import socket
          import sys

          host = os.environ.get("SERVER_HOST", "").strip()
          if not host:
              print("::error::Set the SERVER_HOST repository secret.")
              sys.exit(1)
          try:
              port = int(os.environ["SERVER_PORT"])
              if not 1 <= port <= 65535:
                  raise ValueError
          except ValueError:
              print("::error::SERVER_PORT must be a number from 1 to 65535.")
              sys.exit(1)

          try:
              addresses = {entry[4][0] for entry in socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)}
              expected_ip = os.environ["EXPECTED_PUBLIC_IP"].strip()
              if expected_ip not in addresses:
                  print("::error::SERVER_HOST does not resolve to the public IP entered for this test. Update the repository Actions SECRET named SERVER_HOST, not a variable or a different repository's setting.")
                  sys.exit(1)
              print("Confirmed: SERVER_HOST resolves to the public IP entered for this test.", flush=True)
              with socket.create_connection((host, port), timeout=10) as connection:
                  print("TCP connection succeeded from GitHub.", flush=True)
                  connection.settimeout(10)
                  banner = b""
                  while b"\n" not in banner and len(banner) < 1024:
                      part = connection.recv(1024 - len(banner))
                      if not part:
                          break
                      banner += part
                  if not banner.startswith(b"SSH-"):
                      print("::error::Port is reachable, but no SSH greeting was received. Check the service and forwarding destination.")
                      sys.exit(1)
                  print("SSH greeting received. Network connectivity is working; no login was attempted.")
          except socket.gaierror:
              print("::error::SERVER_HOST could not be resolved. Check its value.")
              sys.exit(1)
          except ConnectionRefusedError:
              print("::error::Connection refused. Check the SSH listener and forwarding destination.")
              sys.exit(1)
          except TimeoutError:
              print("::error::Connection or SSH greeting timed out. Check forwarding, filtering, and the network path.")
              sys.exit(1)
          except OSError:
              print("::error::Network connection failed. Check the server address and network path.")
              sys.exit(1)
          PY
