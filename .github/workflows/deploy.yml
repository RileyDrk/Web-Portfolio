name: Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, portfolio-deploy]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Deploy on hosting server
        working-directory: /home/riley-drake/Projects/Websites/Web-Portfolio
        run: bash ./deploy.sh
